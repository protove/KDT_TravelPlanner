worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  root /usr/share/nginx/html;

  log_format json escape=json
    '{"time":"$time_iso8601","request":"$request","status":$status,'
    '"request_time":$request_time,"remote_addr":"$remote_addr"}';
  access_log /var/log/nginx/access.log json;
  error_log /var/log/nginx/error.log warn;
  default_type application/json;
  sendfile on;

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      add_header Cache-Control "no-store" always;
      return 200 '{"status":"ok"}';
    }

    # error_page internally redirects POST requests to these static fixtures.
    # Keep this location ahead of the catch-all 404 so the redirected request
    # returns the fixture body instead of the generic mock-route error.
    location ^~ /responses/ {
      try_files $uri =404;
    }

    location = /v1/places:searchText {
      error_page 405 =200 /responses/places-search.json;
      try_files /responses/places-search.json =404;
    }

    location = /v1/places:searchNearby {
      error_page 405 =200 /responses/places-nearby.json;
      try_files /responses/places-nearby.json =404;
    }

    location ^~ /v1/places/ {
      try_files /responses/place-detail.json =404;
    }

    location = /directions/v2:computeRoutes {
      # The Backend calls Google Routes with POST. Static nginx serving
      # otherwise returns 405 for POST even when the fixture exists.
      error_page 405 =200 /responses/routes-compute.json;
      try_files /responses/routes-compute.json =404;
    }

    location / {
      return 404 '{"error":"mock route not configured"}';
    }
  }
}

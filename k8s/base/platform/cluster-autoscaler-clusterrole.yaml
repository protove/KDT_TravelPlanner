apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:cluster-autoscaler
  labels:
    app.kubernetes.io/name: cluster-autoscaler
    app.kubernetes.io/part-of: travel-planner-platform
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - replicationcontrollers
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/status
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csinodes
      - csidrivers
      - csistoragecapacities
      - volumeattachments
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources:
      - deviceclasses
      - resourceslices
      - resourceclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["create", "patch", "update"]
  - apiGroups: ["policy"]
    resources:
      - pods/eviction
    verbs: ["create"]

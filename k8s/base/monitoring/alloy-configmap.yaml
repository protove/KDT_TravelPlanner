apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: travel-planner-monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: travel-planner-monitoring
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // The EKS DaemonSet is a metrics-only collector. Backend logs are shipped by
    // the Pod-local Alloy sidecar in k8s/base/backend.
    prometheus.remote_write "monitoring" {
      endpoint {
        url = "http://monitoring.dev-eks.kdt-travelplanner.internal:9090/api/v1/write"
      }
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex         = ".+"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "$1"
        action        = "replace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
        separator     = ";"
        regex         = "(.+);(.+)"
        target_label  = "__address__"
        replacement   = "$2:$1"
        action        = "replace"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
        action        = "replace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
        action        = "replace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
        action        = "replace"
      }

      rule {
        target_label = "environment"
        replacement  = "dev-eks"
        action       = "replace"
      }

      rule {
        target_label = "platform"
        replacement  = "eks"
        action       = "replace"
      }
    }

    prometheus.scrape "annotated_pods" {
      targets         = discovery.relabel.annotated_pods.output
      scrape_interval = "15s"
      forward_to      = [prometheus.remote_write.monitoring.receiver]
    }

    prometheus.scrape "kube_state_metrics" {
      targets = [{
        "__address__" = "kube-state-metrics.travel-planner-monitoring.svc.cluster.local:8080",
        "job"         = "kube-state-metrics",
        "environment" = "dev-eks",
        "platform"    = "eks",
      }]

      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.monitoring.receiver]
    }

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: travel-planner
  labels:
    app.kubernetes.io/name: travel-planner-backend
    app.kubernetes.io/part-of: travel-planner
# AWS permissions are attached by Terraform EKS Pod Identity. Keep this
# ServiceAccount annotation-free so account- and role-specific data stays out
# of the GitOps source.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: travel-planner
data:
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "9091"
  SPRING_PROFILES_ACTIVE: "dev"
  # application-dev.yml 기본값은 /app 기준 상대경로라 runner 이미지(spring 유저)에서 쓸 수 없다.
  # compose.dev.yml과 동일하게 Dockerfile이 이미 만들어둔 절대경로로 오버라이드한다.
  LOGGING_FILE_NAME: "/var/log/travel-planner/travel-planner.log"
  # postgres Service DNS 이름 기준. DB 이름은 .env.dev의 POSTGRES_DB(travel_diary_dev)와 일치해야 한다.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/travel_diary_dev"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  OAUTH_ALLOWED_REDIRECT_ORIGINS: "http://localhost:3000"
  OAUTH_FRONTEND_REDIRECT_URL: "http://localhost:3000/auth/callback"
  OAUTH_HTTP_CONNECT_TIMEOUT: "3s"
  OAUTH_HTTP_READ_TIMEOUT: "5s"
  GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:8080/api/v1/auth/oauth2/google/callback"
  NAVER_OAUTH_REDIRECT_URI: "http://localhost:8080/api/v1/auth/oauth2/naver/callback"
  GOOGLE_PLACES_BASE_URL: "https://places.googleapis.com"
  GOOGLE_PLACES_CONNECT_TIMEOUT: "2s"
  GOOGLE_PLACES_READ_TIMEOUT: "3s"
  GOOGLE_ROUTES_BASE_URL: "https://routes.googleapis.com"
  GOOGLE_ROUTES_CONNECT_TIMEOUT: "2s"
  GOOGLE_ROUTES_READ_TIMEOUT: "5s"
  # 로컬 kind 샌드박스에서는 S3 의존성을 끊는다 (실제 EKS 이전 시 재검토).
  PROFILE_IMAGE_STORAGE_ENABLED: "false"
  PROFILE_IMAGE_STORAGE_REGION: "ap-northeast-2"
  PROFILE_IMAGE_STORAGE_BUCKET: ""
  PROFILE_IMAGE_PUBLIC_BASE_URL: ""
  PROFILE_IMAGE_STORAGE_PATH_STYLE_ACCESS_ENABLED: "false"
  PROFILE_IMAGE_UPLOAD_URL_TTL: "10m"

# 문서 목적 전용 파일 — 실제 값은 넣지 않는다. 레포에 실값을 커밋하지 않는다.
#
# 실제 Secret은 로컬에서 이미 gitignore된 .env.dev로부터 생성한다:
#
#   kubectl create secret generic backend-secret \
#     -n travel-planner \
#     --from-env-file=.env.dev
#
# postgres/redis/backend 세 워크로드가 이 Secret 하나를 공유하며,
# 각 워크로드는 필요한 키만 개별 secretKeyRef로 참조한다.
#
# 아래는 backend-deployment.yaml / postgres-deployment.yaml / redis-deployment.yaml이
# 참조하는 키 목록이다 (.env.dev.example과 동일한 키 이름).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: travel-planner
type: Opaque
stringData:
  POSTGRES_DB: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  JWT_SECRET: ""
  # 로컬에서 비어있어도 되는 선택 키 (secretKeyRef.optional: true로 참조됨)
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  NAVER_OAUTH_CLIENT_ID: ""
  NAVER_OAUTH_CLIENT_SECRET: ""
  GOOGLE_MAPS_API_KEY: ""

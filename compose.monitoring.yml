services:
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    depends_on:
      backend:
        condition: service_healthy
      loki:
        condition: service_started
      alloy:
        condition: service_started
    volumes:
      - ./monitoring/prometheus/prometheus.${SPRING_PROFILES_ACTIVE}.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.${SPRING_PROFILES_ACTIVE}.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  alloy:
    image: grafana/alloy:v1.16.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./monitoring/alloy/config.${SPRING_PROFILES_ACTIVE}.alloy:/etc/alloy/config.alloy:ro
      - backend_logs:/var/log/travel-planner:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  prometheus_data:
  loki_data:
  alloy_data:

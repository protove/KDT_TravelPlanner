name: Application Compose Build

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yml"
      - ".env.prod.example"
      - ".github/workflows/compose-build.yml"

permissions:
  contents: read

concurrency:
  group: application-compose-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Production Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file .env.prod.example -f compose.yml config --quiet

      - name: Build application images
        run: docker compose --env-file .env.prod.example -f compose.yml build

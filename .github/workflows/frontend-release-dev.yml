name: Frontend Release (Dev)

# develop-front에 반영된 프론트 코드만 검사한 뒤 dev 정적 프론트를 배포합니다.
# 실제 AWS 자격 증명은 deploy workflow가 GitHub Environment(dev)와 OIDC를 통해 받습니다.

on:
  push:
    branches:
      - develop-front
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"
      - ".github/workflows/frontend-deploy-dev.yml"
      - ".github/workflows/frontend-release-dev.yml"

permissions:
  contents: read

concurrency:
  group: frontend-release-dev
  cancel-in-progress: false

jobs:
  verify-frontend:
    name: Verify Frontend
    uses: ./.github/workflows/frontend-test.yml
    permissions:
      contents: read

  deploy-frontend:
    name: Deploy Frontend to Dev
    needs: verify-frontend
    uses: ./.github/workflows/frontend-deploy-dev.yml
    permissions:
      contents: read
      id-token: write

name: Backend Test

on:
  pull_request:
    branches:
      - develop-backend
      - develop
      - main
    paths:
      - "backend/**"
      - "compose.yml"
      - "compose.test.yml"
      - ".github/workflows/backend-test.yml"
  push:
    branches:
      - develop-backend
      - develop
      - main
    paths:
      - "backend/**"
      - "compose.yml"
      - "compose.test.yml"
      - ".github/workflows/backend-test.yml"

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit and integration tests
        run: ./gradlew check --no-daemon --project-cache-dir "${RUNNER_TEMP}/travel-planner-gradle-project-cache"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/**
            backend/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

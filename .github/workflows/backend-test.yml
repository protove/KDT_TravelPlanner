name: Backend Verification

on:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, Integration, and Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDER_IMAGE: travel-planner-backend-builder:${{ github.sha }}
      RUNNER_IMAGE: travel-planner-backend:${{ github.sha }}
      TEST_CONTAINER: travel-planner-backend-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Build backend builder image
        run: docker build --target builder --tag "${BUILDER_IMAGE}" ./backend

      - name: Run unit and integration tests in builder container
        run: |
          docker run --name "${TEST_CONTAINER}" \
            --add-host host.docker.internal:host-gateway \
            --env SPRING_PROFILES_ACTIVE=test \
            --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}/backend/docker:/app/docker:ro" \
            "${BUILDER_IMAGE}" \
            ./gradlew check --no-daemon \
              --project-cache-dir /tmp/travel-planner-gradle-project-cache

      - name: Copy test reports from container
        if: always()
        run: |
          report_directory="${RUNNER_TEMP}/backend-test-reports"
          mkdir -p "${report_directory}/reports" "${report_directory}/results"

          if docker container inspect "${TEST_CONTAINER}" >/dev/null 2>&1; then
            docker cp "${TEST_CONTAINER}:/app/build/reports/tests/." \
              "${report_directory}/reports/" || true
            docker cp "${TEST_CONTAINER}:/app/build/test-results/." \
              "${report_directory}/results/" || true
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: ${{ runner.temp }}/backend-test-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Build final backend image
        run: docker build --tag "${RUNNER_IMAGE}" ./backend

      - name: Remove test container
        if: always()
        run: docker rm --force "${TEST_CONTAINER}" 2>/dev/null || true

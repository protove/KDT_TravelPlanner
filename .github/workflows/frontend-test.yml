name: Frontend Verification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-verification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Storybook, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Build production bundle (type-check + next build)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-key
        run: npm run build

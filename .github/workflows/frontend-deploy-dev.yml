name: Frontend Deploy (Dev, Temporary)

# ⚠️ 임시 워크플로입니다.
# 팀장 부재 중 CI/CD 파이프라인 자체를 먼저 검증하기 위해 개인 AWS 계정의
# S3 버킷 + CloudFront 배포를 대상으로 만든 임시 배포입니다.
# 팀장 복귀 후 아래 GitHub Secrets(AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID)를 팀 계정 값으로 교체해야 합니다.
#
# 트리거를 develop-front로의 PR로 잡은 이유: workflow_dispatch는 GitHub 특성상
# 기본 브랜치(main)에 이 파일이 있어야만 수동 실행 UI에 노출된다. pull_request
# 트리거는 이 제약이 없어서, 이 브랜치에서 PR을 여는 즉시 실제 배포 파이프라인이
# 그대로 실행되어 CI/CD 자체를 검증할 수 있다.

on:
  pull_request:
    branches:
      - develop-front
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.DEV_NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Sync to S3
        run: |
          aws s3 sync frontend/out "s3://${{ secrets.S3_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

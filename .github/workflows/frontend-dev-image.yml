name: Frontend Development Image

on:
  pull_request:
    branches:
      - develop-front
    paths:
      - "frontend/Dockerfile"
      - "compose.yml"
      - "compose.dev.yml"
      - ".env.dev.example"
      - ".github/workflows/frontend-dev-image.yml"

permissions:
  contents: read

concurrency:
  group: frontend-development-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Development Compose and Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Validate development Compose configuration
        run: |
          docker compose --env-file .env.dev.example \
            -f compose.yml -f compose.dev.yml config --quiet

      - name: Verify frontend environment keys
        run: |
          required_keys='["NEXT_PUBLIC_API_BASE_URL","NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"]'
          docker compose --env-file .env.dev.example \
            -f compose.yml -f compose.dev.yml config --format json \
            | jq --exit-status --argjson required_keys "${required_keys}" '
                .services.frontend.environment as $environment
                | [$required_keys[] as $key | select(($environment | has($key)) | not) | $key] as $missing
                | if ($missing | length) == 0 then true
                  else error("Missing frontend environment keys: " + ($missing | join(", ")))
                  end
              ' >/dev/null

      - name: Build frontend development image
        run: |
          docker compose --env-file .env.dev.example \
            -f compose.yml -f compose.dev.yml build frontend

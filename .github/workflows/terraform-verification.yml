name: Terraform Verification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  eks-automation-offline:
    name: Offline EKS Automation Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify offline toolchain
        run: |
          python3 --version
          kubectl version --client
          jq --version
          shellcheck --version

      - name: Render staged Kustomize roots
        run: |
          set -euo pipefail
          for root in \
            k8s/overlays/dev-eks \
            k8s/overlays/dev-eks/platform \
            k8s/overlays/dev-eks/workload
          do
            kubectl kustomize "${root}" >/dev/null
          done

      - name: Run EKS renderer and runner contracts
        run: |
          set -euo pipefail
          # PR CI runs only repository-contained contracts. The remaining
          # operator-continuity suites intentionally bind ignored backend.hcl,
          # authenticated handoffs, private evidence, or local reference docs
          # and remain part of the local pre-apply verification boundary.
          python3 -m unittest \
            scripts.eks.tests.test_bastion_repair \
            scripts.eks.tests.test_bastion_user_data \
            scripts.eks.tests.test_bootstrap_backend_secret \
            scripts.eks.tests.test_dev_eks_complete_verify_destroy \
            scripts.eks.tests.test_dev_eks_destroy_verifier \
            scripts.eks.tests.test_dev_eks_repair_smoke \
            scripts.eks.tests.test_render_action_time \
            scripts.eks.tests.test_run_dev_eks_deployment

      - name: Check EKS shell syntax and lint
        run: |
          set -euo pipefail
          for script in scripts/eks/*.sh; do
            bash -n "${script}"
            shellcheck --severity=warning "${script}"
          done

      - name: Check diff whitespace and forbidden live inputs
        run: |
          git diff --check
          ! rg -n --glob 'scripts/eks/**' --glob 'k8s/overlays/dev-eks/**' \
            '(^|[[:space:]])(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|SecretString[[:space:]]*[:=])' .

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/bootstrap
          - infra/environments/dev
          - infra/environments/dev-eks
          - infra/environments/dev-load-test
          - infra/environments/dev-runtime
          - infra/environments/prod
          - infra/modules/terraform_state_backend
          - infra/modules/profile_image
          - infra/modules/static_frontend
          - infra/modules/network
          - infra/modules/container_registry
          - infra/modules/github_ecr_publisher
          - infra/modules/github_frontend_deployer
          - infra/modules/runtime_security
          - infra/modules/backend_data
          - infra/modules/backend_service
          - infra/modules/monitoring_ec2
          - infra/modules/load_test_security
          - infra/modules/load_test_runner
          - infra/modules/eks_cluster
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  test:
    name: Test ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/environments/dev-eks
          - infra/environments/dev-load-test
          - infra/modules/terraform_state_backend
          - infra/modules/profile_image
          - infra/modules/static_frontend
          - infra/modules/network
          - infra/modules/container_registry
          - infra/modules/github_ecr_publisher
          - infra/modules/github_frontend_deployer
          - infra/modules/runtime_security
          - infra/modules/backend_data
          - infra/modules/backend_service
          - infra/modules/monitoring_ec2
          - infra/modules/load_test_security
          - infra/modules/load_test_runner
          - infra/modules/eks_cluster
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize test module
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Run mock-provider tests
        working-directory: ${{ matrix.directory }}
        run: terraform test

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        run: tflint --init --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint Terraform
        run: |
          for directory in \
            infra/bootstrap \
            infra/environments/dev \
            infra/environments/dev-eks \
            infra/environments/dev-load-test \
            infra/environments/dev-runtime \
            infra/environments/prod \
            infra/modules/terraform_state_backend \
            infra/modules/profile_image \
            infra/modules/static_frontend \
            infra/modules/network \
            infra/modules/container_registry \
            infra/modules/github_ecr_publisher \
            infra/modules/github_frontend_deployer \
            infra/modules/runtime_security \
            infra/modules/backend_data \
            infra/modules/backend_service \
            infra/modules/monitoring_ec2 \
            infra/modules/load_test_security \
            infra/modules/load_test_runner \
            infra/modules/eks_cluster
          do
            tflint \
              --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl" \
              --chdir="${directory}"
          done

  trivy:
    name: Trivy IaC and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Terraform misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: infra
          scanners: misconfig
          trivyignores: infra/.trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table

name: Main Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # ── 프론트 검증 ────────────────────────────────────────────
  # TODO: 팀 회의 후 확정 필요. 현재는 자리만 잡아둔 상태.
  # 프론트 담당자와 논의해 실제 검증 step으로 채워야 함
  # (예: lint, 단위 테스트, 빌드 등)
  verify-frontend:
    name: Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Placeholder
        run: 'echo "TODO: 프론트 검증 내용 팀 회의 후 확정 필요"'

  # ── 백엔드 검증 ────────────────────────────────────────────
  # 기존 backend-test.yml을 workflow_call로 재사용
  # (Testcontainers 기반 단위/통합 테스트 + 이미지 빌드 검증)
  verify-backend:
    name: Verify Backend
    uses: ./.github/workflows/backend-test.yml

  # ── 통합(Compose) 검증 ────────────────────────────────────
  # TODO: 팀 회의 후 확정 필요. "통합 검증"의 정확한 범위(어떤 조합의
  # compose를 어떤 시나리오로 검증할지)를 팀과 논의해야 함.
  # 참고: 기존 compose-build.yml이 유사한 역할(운영 이미지 빌드 검증)을
  #이미 하고 있어, 그대로 재사용하거나 확장하는 방향을 검토
  verify-compose:
    name: Verify Compose Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Placeholder
        run: 'echo "TODO: 통합 검증 범위 팀 회의 후 확정 필요"'

  # ── 프론트 배포 ────────────────────────────────────────────
  # TODO: frontend-deploy-dev.yml 아직 작성되지 않음 (프론트 담당자 확인 필요)
  deploy-frontend:
    name: Deploy Frontend
    needs:
      - verify-frontend
      - verify-backend
      - verify-compose
    uses: ./.github/workflows/frontend-deploy-dev.yml
    permissions:
      contents: read
      id-token: write

  # ── 백엔드 배포 ────────────────────────────────────────────
  # 검증 3개(프론트/백엔드/통합)가 모두 통과해야만 실행됨
  deploy-backend:
    name: Deploy Backend
    needs:
      - verify-frontend
      - verify-backend
      - verify-compose
    uses: ./.github/workflows/backend-deploy-dev.yml
    permissions:
      contents: read
      id-token: write

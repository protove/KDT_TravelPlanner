name: Backend ECR Push
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "compose.yml"
      - ".env.prod.example"
      - ".github/workflows/backend-ecr-push.yml"
permissions:
  contents: read
  id-token: write # OIDC로 AWS 인증받기 위해 필요 (고정 키 없이 임시 자격증명 발급)
concurrency:
  group: backend-ecr-push-${{ github.ref }}
  cancel-in-progress: false # 배포 워크플로는 중간에 취소하면 안 되므로 false
jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # ── OIDC로 AWS 인증 (고정 Access Key 미사용) ──────────────────
      # AWS_OIDC_ROLE_ARN: 조장님이 만드실 IAM Role의 ARN
      #   (Settings > Secrets and variables > Actions > Variables 에 등록 예정)
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Buildx 설정 (캐시 사용을 위해 필요) ──────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 빌드 + 태깅 + push를 한 번에 (GitHub Actions 캐시 재사용) ──
      # cache-from/cache-to: 이전 빌드 결과(레이어)를 GitHub Actions
      #   캐시에 저장해뒀다가 재사용 → 안 바뀐 레이어는 다시 안 만듦
      # 태깅 전략: {git-sha} + latest 병행
      #   git-sha → 정확한 롤백 지점 추적, latest → 최신 이미지 쉽게 참조
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${ECR_REGISTRY}/${ECR_REPOSITORY}:latest\`" >> "$GITHUB_STEP_SUMMARY"

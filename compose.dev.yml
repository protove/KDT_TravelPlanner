services:
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  frontend-storybook:
    build:
      context: ./frontend
      target: dev
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_storybook_cache:/app/node_modules/.cache
    ports:
      - "127.0.0.1:${STORYBOOK_PORT}:6006"
    networks:
      - app-network

  backend:
    build:
      target: dev
    environment:
      LOGGING_FILE_NAME: /var/log/travel-planner/travel-planner.log
      AWS_PROFILE: kdt-travel-runtime
    ports:
      - "127.0.0.1:${MANAGEMENT_PORT:-9091}:9091"
    volumes:
      - ./backend:/app
      - backend_gradle:/root/.gradle
      - backend_build:/app/build
      - ~/.aws:/root/.aws:ro

  # 로컬 GUI 툴(TablePlus/DBeaver 등)에서 붙기 위한 dev 전용 포트 공개.
  # postgres는 compose.yml에서 app-network 내부에만 열려 있어서, 이 override 없이는
  # 호스트(맥)에서 접속할 방법이 없음.
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

volumes:
  frontend_node_modules:
  frontend_next:
  frontend_storybook_cache:
  backend_gradle:
  backend_build:

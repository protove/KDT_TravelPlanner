services:
  frontend:
    build:
      target: dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  backend:
    build:
      target: dev
    environment:
      LOGGING_FILE_NAME: /var/log/travel-planner/travel-planner.log
    volumes:
      - ./backend:/app
      - backend_gradle:/root/.gradle
      - backend_build:/app/build

volumes:
  frontend_node_modules:
  frontend_next:
  backend_gradle:
  backend_build:

spring:
  main:
    banner-mode: "off"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: WARN

app:
  auth:
    oauth:
      state-ttl: 5m
      exchange-code-ttl: 60s
      allowed-redirect-origins:
        - http://localhost:3000
  security:
    jwt:
      secret: test-jwt-secret-with-at-least-32-bytes

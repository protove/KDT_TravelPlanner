spring:
  main:
    banner-mode: "off"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: WARN

app:
  auth:
    oauth:
      state-ttl: 5m
      exchange-code-ttl: 60s
      allowed-redirect-origins:
        - http://localhost:3000
      frontend-redirect-url: http://localhost:3000/auth/callback
      google:
        client-id: test-google-client-id
        client-secret: test-google-client-secret
        redirect-uri: http://localhost:8080/api/v1/auth/oauth2/google/callback
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
  security:
    jwt:
      secret: test-jwt-secret-with-at-least-32-bytes

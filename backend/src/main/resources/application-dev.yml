logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/travel-planner.log}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] requestId=%X{requestId} %logger{36} : %msg %kvp%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] requestId=%X{requestId} %logger{36} : %msg %kvp%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB

logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/travel-planner.log}
  structured:
    format:
      file: ecs
    ecs:
      service:
        environment: dev
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 500MB

app:
  logging:
    error-frame-limit: 50
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-jwt-secret-change-me}

spring:
  application:
    name: travel-planner-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_diary_dev}
    username: ${SPRING_DATASOURCE_USERNAME:travel_diary}
    password: ${SPRING_DATASOURCE_PASSWORD:travel_diary_password}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:travel_diary_redis_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

app:
  external:
    google:
      places:
        api-key: ${GOOGLE_MAPS_API_KEY:}
        base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
        connect-timeout: ${GOOGLE_PLACES_CONNECT_TIMEOUT:2s}
        read-timeout: ${GOOGLE_PLACES_READ_TIMEOUT:3s}
      routes:
        api-key: ${GOOGLE_MAPS_API_KEY:}
        base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
        connect-timeout: ${GOOGLE_ROUTES_CONNECT_TIMEOUT:2s}
        read-timeout: ${GOOGLE_ROUTES_READ_TIMEOUT:5s}
  storage:
    profile-image:
      enabled: ${PROFILE_IMAGE_STORAGE_ENABLED:false}
      endpoint: ${PROFILE_IMAGE_STORAGE_ENDPOINT:}
      region: ${PROFILE_IMAGE_STORAGE_REGION:ap-northeast-2}
      access-key: ${PROFILE_IMAGE_STORAGE_ACCESS_KEY:}
      secret-key: ${PROFILE_IMAGE_STORAGE_SECRET_KEY:}
      bucket: ${PROFILE_IMAGE_STORAGE_BUCKET:}
      path-style-access-enabled: ${PROFILE_IMAGE_STORAGE_PATH_STYLE_ACCESS_ENABLED:true}
      upload-url-ttl: ${PROFILE_IMAGE_UPLOAD_URL_TTL:10m}
  auth:
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:30d}
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    oauth:
      state-ttl: ${OAUTH_STATE_TTL:5m}
      state-cookie-secure: false
      exchange-code-ttl: ${OAUTH_EXCHANGE_CODE_TTL:60s}
      allowed-redirect-origins: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000}
      frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}
      http-client:
        connect-timeout: ${OAUTH_HTTP_CONNECT_TIMEOUT:3s}
        read-timeout: ${OAUTH_HTTP_READ_TIMEOUT:5s}
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/google/callback}
        authorization-uri: ${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
        token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
        user-info-uri: ${GOOGLE_OAUTH_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      naver:
        client-id: ${NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${NAVER_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/naver/callback}
        authorization-uri: ${NAVER_OAUTH_AUTHORIZATION_URI:https://nid.naver.com/oauth2.0/authorize}
        token-uri: ${NAVER_OAUTH_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
        user-info-uri: ${NAVER_OAUTH_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:travel-planner-backend}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

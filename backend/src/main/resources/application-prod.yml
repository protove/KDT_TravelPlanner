logging:
  file:
    name: ${LOGGING_FILE_NAME:/var/log/travel-planner/travel-planner.log}
  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: prod
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB

app:
  auth:
    refresh-token:
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
  security:
    jwt:
      secret: ${JWT_SECRET}

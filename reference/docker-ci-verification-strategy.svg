<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">TravelPlanner Docker 기반 CI 검증 전략</title>
  <desc id="description">로컬 개발용 dev 이미지, CI builder 테스트, 배포용 runner 이미지의 차이와 develop-backend, develop, main PR별 검증 흐름을 설명하는 다이어그램</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8AA0B6"/>
    </marker>
    <style>
      .base { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .title { font-size: 44px; font-weight: 800; fill: #17324D; letter-spacing: -1px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #536A80; }
      .eyebrow { font-size: 15px; font-weight: 800; fill: #2F6BFF; letter-spacing: 1.2px; }
      .card-title { font-size: 27px; font-weight: 800; fill: #17324D; }
      .card-subtitle { font-size: 16px; font-weight: 700; fill: #63788B; }
      .line { font-size: 18px; font-weight: 600; fill: #344B60; }
      .note { font-size: 15px; font-weight: 500; fill: #63788B; }
      .flow-title { font-size: 20px; font-weight: 800; fill: #17324D; }
      .flow-line { font-size: 15px; font-weight: 600; fill: #536A80; }
      .badge { font-size: 14px; font-weight: 800; fill: #FFFFFF; }
      .legend-title { font-size: 17px; font-weight: 800; fill: #17324D; }
      .legend-line { font-size: 14px; font-weight: 600; fill: #536A80; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F7F9FC"/>
  <circle cx="1815" cy="-35" r="240" fill="#E7EEFF"/>
  <circle cx="40" cy="1060" r="190" fill="#EAF7F1"/>

  <g class="base">
    <rect x="70" y="42" width="202" height="32" rx="16" fill="#E7EEFF"/>
    <text x="171" y="64" text-anchor="middle" class="eyebrow">CI ARCHITECTURE</text>
    <text x="70" y="123" class="title">TravelPlanner Docker 기반 CI 검증 전략</text>
    <text x="70" y="158" class="subtitle">로컬 개발 이미지, 테스트 실행 환경, 배포 이미지는 목적이 다르며 PR 단계에 맞게 검증합니다.</text>

    <g filter="url(#shadow)">
      <rect x="70" y="200" width="520" height="345" rx="24" fill="#FFFFFF" stroke="#B9CCFF"/>
      <rect x="700" y="200" width="520" height="345" rx="24" fill="#FFFFFF" stroke="#A8DEC5"/>
      <rect x="1330" y="200" width="520" height="345" rx="24" fill="#FFFFFF" stroke="#F0C58B"/>
    </g>

    <rect x="70" y="200" width="520" height="9" rx="5" fill="#4E7FFF"/>
    <rect x="700" y="200" width="520" height="9" rx="5" fill="#1F9D68"/>
    <rect x="1330" y="200" width="520" height="9" rx="5" fill="#D97706"/>

    <rect x="100" y="229" width="152" height="30" rx="15" fill="#4E7FFF"/>
    <text x="176" y="250" text-anchor="middle" class="badge">LOCAL ONLY</text>
    <text x="100" y="301" class="card-title">Local Development</text>
    <text x="100" y="328" class="card-subtitle">Dockerfile `dev` · compose.dev.yml</text>
    <text x="105" y="373" class="line">• JDK 21 + Gradle + 전체 소스</text>
    <text x="105" y="408" class="line">• dev-entrypoint · 지속 컴파일</text>
    <text x="105" y="443" class="line">• source / Gradle / build volume</text>
    <text x="105" y="478" class="line">• 목적: 핫 리로드와 개발 생산성</text>
    <text x="105" y="516" class="note">배포 대상이 아니며 관련 인프라 변경 때만 CI 빌드</text>

    <rect x="730" y="229" width="154" height="30" rx="15" fill="#1F9D68"/>
    <text x="807" y="250" text-anchor="middle" class="badge">PR QUALITY</text>
    <text x="730" y="301" class="card-title">CI Verification</text>
    <text x="730" y="328" class="card-subtitle">Dockerfile `builder` · Spring `test`</text>
    <text x="735" y="373" class="line">• ./gradlew check --no-daemon</text>
    <text x="735" y="408" class="line">• 단위 테스트 + Spring 통합 테스트</text>
    <text x="735" y="443" class="line">• Testcontainers PostgreSQL · Redis</text>
    <text x="735" y="478" class="line">• 실제 OAuth · Google · S3 호출 없음</text>
    <text x="735" y="516" class="note">코드 동작과 DB 경계를 검증하고 보고서를 보관</text>

    <rect x="1360" y="229" width="166" height="30" rx="15" fill="#D97706"/>
    <text x="1443" y="250" text-anchor="middle" class="badge">DEPLOYABLE</text>
    <text x="1360" y="301" class="card-title">Final Runner Image</text>
    <text x="1360" y="328" class="card-subtitle">Dockerfile final `runner` stage</text>
    <text x="1365" y="373" class="line">• JRE + app.jar · non-root user</text>
    <text x="1365" y="408" class="line">• JDK · Gradle · 소스 코드 제외</text>
    <text x="1365" y="443" class="line">• 실제 환경값과 비밀값 미포함</text>
    <text x="1365" y="478" class="line">• 실행 시 staging / prod 설정 주입</text>
    <text x="1365" y="516" class="note">일반 docker build의 결과가 곧 배포용 최종 이미지</text>

    <line x1="600" y1="370" x2="680" y2="370" stroke="#8AA0B6" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <text x="640" y="349" text-anchor="middle" class="note">분리</text>
    <line x1="1230" y1="370" x2="1310" y2="370" stroke="#8AA0B6" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1270" y="349" text-anchor="middle" class="note">통과 후 빌드</text>

    <g filter="url(#shadow)">
      <rect x="70" y="578" width="1780" height="92" rx="20" fill="#FFFFFF" stroke="#D9E2EC"/>
    </g>
    <text x="100" y="614" class="legend-title">서로 다른 네 개념</text>
    <rect x="310" y="596" width="292" height="50" rx="15" fill="#EDF3FF"/>
    <text x="456" y="616" text-anchor="middle" class="legend-title">이미지 빌드</text>
    <text x="456" y="638" text-anchor="middle" class="legend-line">불변 파일시스템과 실행 산출물</text>
    <rect x="620" y="596" width="350" height="50" rx="15" fill="#EAF7F1"/>
    <text x="795" y="616" text-anchor="middle" class="legend-title">컨테이너 실행 설정</text>
    <text x="795" y="638" text-anchor="middle" class="legend-line">포트 · 네트워크 · command</text>
    <rect x="988" y="596" width="300" height="50" rx="15" fill="#FFF1DD"/>
    <text x="1138" y="616" text-anchor="middle" class="legend-title">Spring 프로필</text>
    <text x="1138" y="638" text-anchor="middle" class="legend-line">실행 시 환경별 설정 선택</text>
    <rect x="1306" y="596" width="510" height="50" rx="15" fill="#F3F0FF"/>
    <text x="1561" y="616" text-anchor="middle" class="legend-title">볼륨 마운트</text>
    <text x="1561" y="638" text-anchor="middle" class="legend-line">실행 시 host / volume 경로 연결 · 이미지와 별개</text>

    <text x="70" y="725" class="eyebrow">PULL REQUEST GATES</text>

    <g filter="url(#shadow)">
      <rect x="70" y="748" width="410" height="205" rx="22" fill="#FFFFFF" stroke="#A8DEC5"/>
      <rect x="526" y="748" width="410" height="205" rx="22" fill="#FFFFFF" stroke="#B9CCFF"/>
      <rect x="982" y="748" width="410" height="205" rx="22" fill="#FFFFFF" stroke="#F0C58B"/>
      <rect x="1438" y="748" width="412" height="205" rx="22" fill="#FFFFFF" stroke="#E1B7F2"/>
    </g>

    <rect x="70" y="748" width="410" height="8" rx="4" fill="#1F9D68"/>
    <text x="100" y="799" class="flow-title">기능 → develop-backend</text>
    <text x="100" y="835" class="flow-line">1. builder 이미지에서 전체 check</text>
    <text x="100" y="865" class="flow-line">2. 테스트 보고서 artifact</text>
    <text x="100" y="895" class="flow-line">3. 최종 backend runner 이미지 빌드</text>
    <text x="100" y="929" class="note">기능·DB 경계 + 배포 패키징</text>

    <rect x="526" y="748" width="410" height="8" rx="4" fill="#4E7FFF"/>
    <text x="556" y="799" class="flow-title">dev 인프라 변경 · 조건부</text>
    <text x="556" y="835" class="flow-line">1. dev / test Compose config</text>
    <text x="556" y="865" class="flow-line">2. backend dev 이미지 빌드</text>
    <text x="556" y="895" class="flow-line">3. dev-entrypoint 기존 테스트</text>
    <text x="556" y="929" class="note">Dockerfile · compose.dev · entrypoint 등</text>

    <rect x="982" y="748" width="410" height="8" rx="4" fill="#D97706"/>
    <text x="1012" y="799" class="flow-title">develop 대상 PR</text>
    <text x="1012" y="835" class="flow-line">1. 기본 Compose config</text>
    <text x="1012" y="865" class="flow-line">2. frontend runner 이미지</text>
    <text x="1012" y="895" class="flow-line">3. backend runner 이미지</text>
    <text x="1012" y="929" class="note">전체 애플리케이션 이미지 조립 검증</text>

    <rect x="1438" y="748" width="412" height="8" rx="4" fill="#8B5CF6"/>
    <text x="1468" y="799" class="flow-title">main 대상 PR</text>
    <text x="1468" y="835" class="flow-line">현재: develop과 같은 Compose build</text>
    <text x="1468" y="865" class="flow-line">후속: up --wait + HTTP smoke</text>
    <text x="1468" y="895" class="flow-line">후속: monitoring 연동 + CD</text>
    <text x="1468" y="929" class="note">프론트 협의 후 production-like 강화</text>

    <rect x="70" y="984" width="1780" height="58" rx="20" fill="#17324D"/>
    <text x="105" y="1021" font-size="18" font-weight="800" fill="#FFFFFF">결정:</text>
    <text x="178" y="1021" font-size="17" font-weight="600" fill="#DCE8F3">push CI 제거 · 실제 비밀값은 이미지에 저장하지 않음 · 같은 배포 이미지를 런타임 설정으로 승격 · 실제 CD는 후속 이슈</text>
    <text x="1818" y="1021" text-anchor="end" font-size="13" font-weight="600" fill="#9FB2C5">ISSUE #87 · 2026-07-17</text>
  </g>
</svg>

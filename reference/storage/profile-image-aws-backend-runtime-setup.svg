<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">프로필 이미지 AWS 인프라와 백엔드 런타임 연결</title>
  <desc id="desc">Terraform으로 적용한 비공개 S3와 CloudFront, 백엔드 환경변수, 개발 SSO 마운트, Presigned PUT와 완료 API의 DB 반영 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#12243a"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .title { font-size: 48px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #bae6fd; }
      .section { font-size: 25px; font-weight: 700; fill: #e2e8f0; }
      .card-title { font-size: 24px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 20px; font-weight: 500; fill: #cbd5e1; }
      .small { font-size: 17px; font-weight: 500; fill: #94a3b8; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 17px; fill: #dbeafe; }
      .status { font-size: 18px; font-weight: 700; fill: #bbf7d0; }
      .pending { font-size: 18px; font-weight: 700; fill: #fde68a; }
      .box { fill: #15263b; stroke: #35506d; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-blue { fill: #102b4f; stroke: #38bdf8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-green { fill: #12352f; stroke: #34d399; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-amber { fill: #3a2b16; stroke: #fbbf24; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .pill-green { fill: #14532d; stroke: #4ade80; stroke-width: 1.5; rx: 18; }
      .pill-amber { fill: #713f12; stroke: #fbbf24; stroke-width: 1.5; rx: 18; }
      .line { fill: none; stroke: #67e8f9; stroke-width: 4; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowMuted); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="138" fill="url(#header)"/>
  <text x="80" y="68" class="title">프로필 이미지 AWS 인프라 → 백엔드 런타임 연결</text>
  <text x="82" y="108" class="subtitle">Terraform 적용 완료 · 실제 AWS drift 없음 · .env.dev output 일치 · 장기 Access Key 없음</text>

  <rect x="1530" y="36" width="310" height="60" class="pill-green"/>
  <text x="1685" y="74" text-anchor="middle" class="status">✓ VERIFIED · 2026-07-28</text>

  <text x="72" y="190" class="section">1. 적용 완료된 인프라와 설정</text>

  <rect x="70" y="220" width="390" height="220" class="box-blue"/>
  <text x="100" y="262" class="card-title">Terraform · dev State</text>
  <text x="100" y="302" class="body">S3 · CloudFront · OAC</text>
  <text x="100" y="337" class="body">Runtime IAM Policy 생성</text>
  <text x="100" y="378" class="mono">terraform plan → No changes</text>
  <rect x="100" y="396" width="195" height="30" class="pill-green"/>
  <text x="198" y="417" text-anchor="middle" class="status">APPLIED + MATCHED</text>

  <rect x="530" y="220" width="390" height="220" class="box"/>
  <text x="560" y="262" class="card-title">백엔드 환경변수</text>
  <text x="560" y="302" class="mono">STORAGE_BUCKET ← output</text>
  <text x="560" y="335" class="mono">PUBLIC_BASE_URL ← output</text>
  <text x="560" y="368" class="mono">REGION=ap-northeast-2</text>
  <text x="560" y="401" class="mono">PATH_STYLE=false · TTL=10m</text>
  <text x="560" y="428" class="small">Access Key · Secret Key · Endpoint 없음</text>

  <rect x="990" y="220" width="390" height="220" class="box-amber"/>
  <text x="1020" y="262" class="card-title">개발 Docker SSO · 담당자 작업</text>
  <text x="1020" y="302" class="mono">AWS_PROFILE=kdt-travel-runtime</text>
  <text x="1020" y="335" class="mono">${HOME}/.aws → /root/.aws:ro</text>
  <text x="1020" y="368" class="body">compose.dev.yml에만 추가</text>
  <text x="1020" y="401" class="body">SDK sso · ssooidc 모듈 추가</text>
  <rect x="1020" y="410" width="165" height="30" class="pill-amber"/>
  <text x="1103" y="431" text-anchor="middle" class="pending">PENDING</text>

  <rect x="1450" y="220" width="400" height="220" class="box-green"/>
  <text x="1480" y="262" class="card-title">Runtime 최소권한</text>
  <text x="1480" y="302" class="mono">GetObject · PutObject</text>
  <text x="1480" y="335" class="mono">users/*/profile/*</text>
  <text x="1480" y="368" class="mono">ListBucket + prefix 조건</text>
  <text x="1480" y="405" class="small">Terraform · State 권한과 완전 분리</text>

  <path d="M460 330 H520" class="line"/>
  <path d="M920 330 H980" class="line-muted"/>
  <path d="M1380 330 H1440" class="line"/>

  <text x="72" y="505" class="section">2. Presigned PUT 업로드와 완료 API</text>

  <rect x="70" y="545" width="260" height="155" class="box"/>
  <text x="200" y="588" text-anchor="middle" class="card-title">JWT 사용자</text>
  <text x="200" y="628" text-anchor="middle" class="body">upload-url 요청</text>
  <text x="200" y="663" text-anchor="middle" class="small">파일 형식 · 크기 전달</text>

  <rect x="410" y="545" width="330" height="155" class="box-blue"/>
  <text x="575" y="588" text-anchor="middle" class="card-title">Spring Backend</text>
  <text x="575" y="628" text-anchor="middle" class="body">사용자 경로 objectKey</text>
  <text x="575" y="663" text-anchor="middle" class="body">Presigned PUT 발급</text>

  <rect x="820" y="545" width="290" height="155" class="box"/>
  <text x="965" y="588" text-anchor="middle" class="card-title">브라우저</text>
  <text x="965" y="628" text-anchor="middle" class="body">Presigned URL에 PUT</text>
  <text x="965" y="663" text-anchor="middle" class="small">JWT · AWS 키 전달 없음</text>

  <rect x="1190" y="545" width="290" height="155" class="box-green"/>
  <text x="1335" y="588" text-anchor="middle" class="card-title">Private S3</text>
  <text x="1335" y="628" text-anchor="middle" class="body">users/{userId}/profile</text>
  <text x="1335" y="663" text-anchor="middle" class="small">PUT 저장 · Public 차단</text>

  <rect x="1560" y="545" width="290" height="155" class="box-blue"/>
  <text x="1705" y="588" text-anchor="middle" class="card-title">complete API</text>
  <text x="1705" y="628" text-anchor="middle" class="body">HeadObject 검증</text>
  <text x="1705" y="663" text-anchor="middle" class="small">소유 경로 · 타입 · 1B~5MiB</text>

  <path d="M330 622 H400" class="line"/>
  <path d="M740 622 H810" class="line"/>
  <path d="M1110 622 H1180" class="line"/>
  <path d="M1480 622 H1550" class="line"/>

  <rect x="1080" y="790" width="350" height="150" class="box"/>
  <text x="1255" y="833" text-anchor="middle" class="card-title">PostgreSQL</text>
  <text x="1255" y="872" text-anchor="middle" class="mono">user_table.profile_image_url</text>
  <text x="1255" y="907" text-anchor="middle" class="small">CloudFront URL만 저장</text>

  <rect x="1500" y="790" width="350" height="150" class="box-green"/>
  <text x="1675" y="833" text-anchor="middle" class="card-title">CloudFront 공개 조회</text>
  <text x="1675" y="872" text-anchor="middle" class="body">HTTPS · OAC · nosniff</text>
  <text x="1675" y="907" text-anchor="middle" class="small">공개 URL은 인증 수단이 아님</text>

  <path d="M1705 700 V745 H1255 V780" class="line"/>
  <path d="M1430 865 H1490" class="line"/>

  <rect x="70" y="770" width="880" height="200" fill="#0d1d2e" stroke="#334155" stroke-width="2" rx="18"/>
  <text x="105" y="815" class="card-title">파일 책임 경계</text>
  <text x="105" y="858" class="body">compose.yml</text>
  <text x="305" y="858" class="small">백엔드 S3·CloudFront 환경변수 전달 · 적용 완료</text>
  <text x="105" y="898" class="body">compose.dev.yml</text>
  <text x="305" y="898" class="small">개인 SSO 프로필·읽기 전용 캐시 마운트 · 개발 전용</text>
  <text x="105" y="938" class="body">운영 Runtime</text>
  <text x="305" y="938" class="small">ECS Task Role / EC2 Instance Profile · SSO 마운트 금지</text>

  <text x="960" y="1030" text-anchor="middle" class="small">KDT TravelPlanner · Profile Image Storage Runtime Contract</text>
</svg>

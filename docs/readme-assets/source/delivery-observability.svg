<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KDT Travel Diary 전달과 관측 흐름</title>
  <desc id="desc">변경 제안에서 CI 검증과 OIDC 기반 dev 전달로 이어지는 흐름, 그리고 별도로 실행하는 로컬 관측·증거 리허설</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Inter, sans-serif; }
    .title { font-size: 52px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 23px; font-weight: 500; fill: #475569; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #2563eb; }
    .section { font-size: 28px; font-weight: 800; fill: #0f172a; }
    .card-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .body { font-size: 18px; font-weight: 600; fill: #475569; }
    .small { font-size: 16px; font-weight: 600; fill: #64748b; }
    .card { fill: #fff; stroke: #e2e8f0; stroke-width: 2; }
    .line { fill: none; stroke: #94a3b8; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="120" y="115" class="eyebrow">DELIVERY · OBSERVABILITY · EVIDENCE</text>
  <text x="120" y="185" class="title">검증된 변경만 전달하고, 실행 결과를 관측합니다</text>
  <text x="120" y="228" class="subtitle">위쪽은 변경 전달 경계, 아래쪽은 별도로 실행하는 로컬 검증·증거 경계입니다.</text>

  <text x="120" y="300" class="section">변경 전달 경계</text>
  <g filter="url(#shadow)">
    <rect x="120" y="330" width="330" height="200" rx="22" class="card"/>
    <rect x="520" y="330" width="360" height="200" rx="22" class="card"/>
    <rect x="960" y="330" width="360" height="200" rx="22" class="card"/>
    <rect x="1400" y="330" width="400" height="200" rx="22" class="card"/>
  </g>
  <g>
    <text x="160" y="385" class="eyebrow">01 · CHANGE</text><text x="160" y="430" class="card-title">Commit / Pull Request</text><text x="160" y="470" class="body">코드와 문서 변경을 제안</text><text x="160" y="505" class="small">develop-backend 기준</text>
    <text x="560" y="385" class="eyebrow">02 · CI</text><text x="560" y="430" class="card-title">GitHub Actions 검증</text><text x="560" y="470" class="body">Backend · Frontend · Compose</text><text x="560" y="505" class="small">Monitoring · Terraform 정적 검사</text>
    <text x="1000" y="385" class="eyebrow">03 · OIDC</text><text x="1000" y="430" class="card-title">권한을 나눈 전달</text><text x="1000" y="470" class="body">ECR publisher</text><text x="1000" y="505" class="small">Frontend S3/CloudFront deployer</text>
    <text x="1440" y="385" class="eyebrow">04 · TARGET</text><text x="1440" y="430" class="card-title">AWS dev 리소스</text><text x="1440" y="470" class="body">ECR · S3 · CloudFront</text><text x="1440" y="505" class="small">plan/apply는 운영 절차로 분리</text>
  </g>
  <path d="M450 430 H520" class="line"/><path d="M880 430 H960" class="line"/><path d="M1320 430 H1400" class="line"/>

  <text x="120" y="635" class="section">로컬 검증·증거 경계</text>
  <g filter="url(#shadow)">
    <rect x="120" y="700" width="500" height="200" rx="22" class="card"/>
    <rect x="710" y="700" width="500" height="200" rx="22" class="card"/>
    <rect x="1300" y="700" width="500" height="200" rx="22" class="card"/>
  </g>
  <g>
    <text x="160" y="755" class="eyebrow">01 · REHEARSE</text><text x="160" y="805" class="card-title">Compose rehearsal</text><text x="160" y="845" class="body">Backend · DB · Redis 실행 가능성</text><text x="160" y="880" class="small">prod-like / dev overlay</text>
    <text x="750" y="755" class="eyebrow">02 · OBSERVE</text><text x="750" y="805" class="card-title">Monitoring smoke</text><text x="750" y="845" class="body">target UP · datasource · dashboard</text><text x="750" y="880" class="small">Prometheus · Loki · Alloy · Grafana</text>
    <text x="1340" y="755" class="eyebrow">03 · EVIDENCE</text><text x="1340" y="805" class="card-title">Load &amp; recovery rehearsal</text><text x="1340" y="845" class="body">Smoke · Baseline · Recovery · Spike</text><text x="1340" y="880" class="small">민감정보를 제외한 evidence/ 번들</text>
  </g>
  <path d="M620 800 H710" class="line"/><path d="M1210 800 H1300" class="line"/>
  <rect x="120" y="960" width="1680" height="56" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="160" y="995" font-size="18" font-weight="800" fill="#1d4ed8">BOUNDARY</text><text x="300" y="995" class="body">로컬 결과는 실행 가능성과 증거 파이프라인을 검증하며 AWS 성능/SLO 합격을 대신하지 않습니다.</text>
</svg>

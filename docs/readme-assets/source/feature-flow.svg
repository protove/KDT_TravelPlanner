<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KDT Travel Diary 기능 흐름</title>
  <desc id="desc">OAuth 인증부터 여행 계획, 장소와 지도, 타임라인 작성으로 이어지는 사용자 여정과 영속·지원 계층</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Inter, sans-serif; }
    .title { font-size: 54px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 24px; font-weight: 500; fill: #475569; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #2563eb; }
    .section { font-size: 28px; font-weight: 800; fill: #0f172a; }
    .box-title { font-size: 23px; font-weight: 800; fill: #0f172a; }
    .box-body { font-size: 18px; font-weight: 600; fill: #475569; }
    .small { font-size: 16px; font-weight: 600; fill: #64748b; }
    .active { fill: #eff6ff; stroke: #93c5fd; }
    .support { fill: #f5f3ff; stroke: #c4b5fd; }
    .line { fill: none; stroke: #94a3b8; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="120" y="120" class="eyebrow">FEATURE MAP · IMPLEMENTED SCOPE</text>
  <text x="120" y="194" class="title">사용자의 여행 흐름과 지원 계층을 나눠 봅니다</text>
  <text x="120" y="238" class="subtitle">위쪽은 현재 코드에 확인된 사용자 여정이고, 아래쪽은 결과를 받는 저장·인증·관측 계층입니다.</text>

  <text x="120" y="300" class="section">사용자 여정</text>
  <g filter="url(#shadow)">
    <rect x="120" y="340" width="300" height="270" rx="24" class="active" stroke-width="3"/>
    <rect x="470" y="340" width="300" height="270" rx="24" class="active" stroke-width="3"/>
    <rect x="820" y="340" width="300" height="270" rx="24" class="active" stroke-width="3"/>
    <rect x="1170" y="340" width="300" height="270" rx="24" class="active" stroke-width="3"/>
    <rect x="1520" y="340" width="280" height="270" rx="24" class="active" stroke-width="3"/>
  </g>
  <g stroke="#94a3b8" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M420 475 H470"/><path d="M770 475 H820"/><path d="M1120 475 H1170"/><path d="M1470 475 H1520"/>
  </g>
  <g>
    <circle cx="180" cy="400" r="26" fill="#2563eb"/><text x="172" y="409" font-size="22" font-weight="800" fill="#fff">1</text><text x="160" y="470" class="box-title">사용자 화면</text><text x="160" y="515" class="box-body">로그인 진입 · 여행 목록</text><text x="160" y="552" class="box-body">Next.js 화면</text><text x="160" y="590" class="small">/ · /auth · /trips</text>
    <circle cx="530" cy="400" r="26" fill="#2563eb"/><text x="522" y="409" font-size="22" font-weight="800" fill="#fff">2</text><text x="510" y="470" class="box-title">OAuth 인증</text><text x="510" y="515" class="box-body">Google · Naver</text><text x="510" y="552" class="box-body">Token 교환·갱신·로그아웃</text><text x="510" y="590" class="small">/api/v1/auth/*</text>
    <circle cx="880" cy="400" r="26" fill="#2563eb"/><text x="872" y="409" font-size="22" font-weight="800" fill="#fff">3</text><text x="860" y="470" class="box-title">여행과 멤버</text><text x="860" y="515" class="box-body">Travel CRUD · 초대</text><text x="860" y="552" class="box-body">멤버 권한 관리</text><text x="860" y="590" class="small">/api/v1/travels/*</text>
    <circle cx="1230" cy="400" r="26" fill="#2563eb"/><text x="1222" y="409" font-size="22" font-weight="800" fill="#fff">4</text><text x="1210" y="470" class="box-title">장소와 지도</text><text x="1210" y="515" class="box-body">Places 검색</text><text x="1210" y="552" class="box-body">Map points · Routes</text><text x="1210" y="590" class="small">/api/v1/places · /map-points</text>
    <circle cx="1580" cy="400" r="26" fill="#2563eb"/><text x="1572" y="409" font-size="22" font-weight="800" fill="#fff">5</text><text x="1560" y="470" class="box-title">타임라인</text><text x="1560" y="515" class="box-body">일정 · 메모 · 순서</text><text x="1560" y="552" class="box-body">날짜별 기록</text><text x="1560" y="590" class="small">/timeline-items</text>
  </g>

  <text x="120" y="680" class="section">지원 계층 · 사용자 단계가 아닌 결과 저장과 운영 지원</text>
  <g filter="url(#shadow)">
    <rect x="120" y="720" width="520" height="190" rx="22" class="support" stroke-width="3"/>
    <rect x="700" y="720" width="520" height="190" rx="22" class="support" stroke-width="3"/>
    <rect x="1280" y="720" width="520" height="190" rx="22" class="support" stroke-width="3"/>
  </g>
  <g>
    <text x="160" y="770" class="eyebrow">PERSISTENCE</text><text x="160" y="815" class="box-title">PostgreSQL</text><text x="160" y="855" class="box-body">여행 · 멤버 · timeline 영속 데이터</text><text x="160" y="888" class="small">Compose: postgres:5432</text>
    <text x="740" y="770" class="eyebrow">AUTH · CACHE</text><text x="740" y="815" class="box-title">Redis</text><text x="740" y="855" class="box-body">Refresh/일회용 token · 장소 캐시</text><text x="740" y="888" class="small">세션 저장소로 표현하지 않음</text>
    <text x="1320" y="770" class="eyebrow">OBSERVABILITY</text><text x="1320" y="815" class="box-title">Health · Metrics · Logs</text><text x="1320" y="855" class="box-body">readiness · Prometheus · JSON log</text><text x="1320" y="888" class="small">운영 상태를 확인하는 지원 경계</text>
  </g>
  <rect x="120" y="960" width="1680" height="56" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160" y="995" class="small">추가 화면: 프로필 · 초대/알림 · Community(계획/TBD) · 현재 코드/API audit에서 확인된 범위만 ACTIVE로 표시</text>
</svg>

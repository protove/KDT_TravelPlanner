<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KDT Travel Diary 프로젝트 소개</title>
  <desc id="desc">여행 계획과 기록 기능, 그리고 현재 AWS 환경 경계를 한 장으로 보여주는 README 표지 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.58" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Inter, sans-serif; }
    .title { font-size: 62px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 28px; font-weight: 500; fill: #475569; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #2563eb; }
    .card-title { font-size: 25px; font-weight: 800; fill: #0f172a; }
    .body { font-size: 20px; font-weight: 500; fill: #475569; }
    .small { font-size: 17px; font-weight: 600; fill: #64748b; }
    .white { fill: #fff; }
  </style>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1770" cy="110" r="230" fill="#dbeafe" opacity="0.65"/>
  <circle cx="120" cy="1010" r="180" fill="#e0e7ff" opacity="0.55"/>

  <text x="120" y="132" class="eyebrow">KDT TRAVEL DIARY · PROJECT README</text>
  <text x="120" y="220" class="title">여행을 계획하고, 기록하고, 다시 꺼내 보는 서비스</text>
  <text x="120" y="274" class="subtitle">Next.js · Spring Boot Kotlin · PostgreSQL · Redis · Terraform · GitHub Actions</text>

  <g filter="url(#shadow)">
    <rect x="120" y="350" width="1010" height="570" rx="26" fill="#ffffff"/>
    <rect x="120" y="350" width="1010" height="66" rx="26" fill="#f8fafc"/>
    <circle cx="160" cy="383" r="9" fill="#fda4af"/><circle cx="190" cy="383" r="9" fill="#fcd34d"/><circle cx="220" cy="383" r="9" fill="#86efac"/>
    <rect x="260" y="372" width="590" height="23" rx="11" fill="#e2e8f0"/>
    <rect x="120" y="416" width="210" height="504" fill="#172554"/>
    <text x="156" y="470" font-size="25" font-weight="800" fill="#fff">Travel Diary</text>
    <rect x="150" y="510" width="150" height="48" rx="14" fill="#2563eb"/>
    <text x="177" y="541" font-size="18" font-weight="700" fill="#fff">내 여행</text>
    <text x="177" y="603" font-size="18" font-weight="600" fill="#bfdbfe">타임라인</text>
    <text x="177" y="655" font-size="18" font-weight="600" fill="#bfdbfe">지도와 장소</text>
    <text x="177" y="707" font-size="18" font-weight="600" fill="#bfdbfe">프로필</text>

    <text x="380" y="474" class="card-title">제주도 3박 4일</text>
    <text x="380" y="510" class="small">2026.08.20 — 2026.08.23 · 4명</text>
    <rect x="380" y="550" width="310" height="150" rx="18" fill="#eff6ff"/>
    <text x="410" y="592" font-size="18" font-weight="700" fill="#1d4ed8">NEXT STOP</text>
    <text x="410" y="635" font-size="31" font-weight="800" fill="#0f172a">성산일출봉</text>
    <text x="410" y="674" class="small">장소 검색 · 경로 확인</text>
    <rect x="720" y="550" width="330" height="150" rx="18" fill="#f5f3ff"/>
    <text x="750" y="592" font-size="18" font-weight="700" fill="#7c3aed">TIMELINE</text>
    <text x="750" y="635" font-size="31" font-weight="800" fill="#0f172a">Day 02</text>
    <text x="750" y="674" class="small">오전 09:00 · 카페 · 산책</text>
    <rect x="380" y="738" width="670" height="10" rx="5" fill="#dbeafe"/>
    <rect x="380" y="738" width="440" height="10" rx="5" fill="#2563eb"/>
    <circle cx="820" cy="743" r="16" fill="#16a34a"/>
    <text x="380" y="805" class="body">계획 → 장소 → 일정 → 공유를 한 흐름에서 관리합니다.</text>
    <text x="380" y="846" class="small">인증된 사용자만 여행과 멤버 권한을 변경할 수 있습니다.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="350" width="610" height="570" rx="26" fill="#ffffff"/>
    <text x="1240" y="420" class="eyebrow">CURRENT STATUS · SUBMISSION CHECK</text>
    <text x="1240" y="468" class="card-title">현재 상태 · 사용자 확인</text>
    <rect x="1240" y="510" width="510" height="125" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="1270" y="540" width="104" height="34" rx="17" fill="#16a34a"/>
    <text x="1290" y="563" font-size="16" font-weight="800" fill="#fff">ACTIVE</text>
    <text x="1410" y="557" class="card-title">dev</text>
    <text x="1410" y="590" class="small">지속 관리하는 AWS 기반</text>
    <rect x="1240" y="665" width="510" height="125" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="1270" y="695" width="190" height="34" rx="17" fill="#64748b"/>
    <text x="1290" y="718" font-size="16" font-weight="800" fill="#fff">DESTROYED</text>
    <text x="1490" y="712" class="card-title">dev-runtime</text>
    <text x="1490" y="745" class="small">테스트 완료 후 리소스 삭제</text>
    <text x="1240" y="858" class="body">최종 제출 시점 사용자 확인 기준</text>
    <text x="1240" y="891" class="body">재현 절차는 runbook으로 분리</text>
  </g>

  <text x="120" y="1010" class="small">LOCAL-FIRST · EXPLICIT RUNBOOK · OBSERVABLE DELIVERY</text>
</svg>

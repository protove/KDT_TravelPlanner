<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KDT Travel Diary AWS Terraform 환경 분리</title>
  <desc id="desc">지속 환경 dev, EC2 런타임 dev-runtime, 필요할 때만 생성하는 부하 테스트 dev-load-test의 State와 의존 관계</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Inter, sans-serif; }
    .title { font-size: 50px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #2563eb; }
    .section { font-size: 29px; font-weight: 800; fill: #0f172a; }
    .state { font-size: 16px; font-weight: 700; fill: #64748b; }
    .card-title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .body { font-size: 17px; font-weight: 600; fill: #475569; }
    .small { font-size: 15px; font-weight: 600; fill: #64748b; }
  </style>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="100" y="105" class="eyebrow">TERRAFORM · AWS ENVIRONMENT BOUNDARY</text>
  <text x="100" y="172" class="title">EC2 Runtime과 Load Test의 수명주기를 분리합니다</text>
  <text x="100" y="217" class="subtitle">dev-runtime만으로 애플리케이션을 운영하고, 비교 테스트가 필요할 때만 dev-load-test를 추가합니다.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="300" width="520" height="560" rx="28" fill="#fff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="700" y="300" width="520" height="560" rx="28" fill="#fff" stroke="#86efac" stroke-width="3"/>
    <rect x="1300" y="300" width="520" height="560" rx="28" fill="#fff" stroke="#fdba74" stroke-width="3" stroke-dasharray="12 9"/>
  </g>

  <rect x="140" y="337" width="130" height="36" rx="18" fill="#2563eb"/><text x="165" y="362" font-size="16" font-weight="800" fill="#fff">PERSISTENT</text>
  <text x="140" y="420" class="section">dev</text>
  <text x="140" y="451" class="state">dev/terraform.tfstate</text>
  <rect x="140" y="500" width="440" height="102" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="170" y="540" class="card-title">Persistent Foundation</text><text x="170" y="572" class="body">VPC · ECR · Static Frontend</text>
  <rect x="140" y="630" width="440" height="102" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="670" class="card-title">Shared Inputs</text><text x="170" y="702" class="body">Network · OIDC · Secret ARN</text>
  <text x="140" y="796" class="small">장기 유지되는 기반 리소스</text>

  <rect x="740" y="337" width="145" height="36" rx="18" fill="#16a34a"/><text x="764" y="362" font-size="16" font-weight="800" fill="#fff">EC2 RUNTIME</text>
  <text x="740" y="420" class="section">dev-runtime</text>
  <text x="740" y="451" class="state">dev-runtime/terraform.tfstate</text>
  <rect x="740" y="500" width="440" height="102" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="770" y="540" class="card-title">EC2 Application Runtime</text><text x="770" y="572" class="body">ALB · ASG · RDS · Redis</text>
  <rect x="740" y="630" width="440" height="102" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="770" y="670" class="card-title">Operations</text><text x="770" y="702" class="body">Monitoring EC2 · Runtime Security</text>
  <text x="740" y="796" class="small">Load Runner 없이 독립 plan/apply 가능</text>

  <rect x="1340" y="337" width="150" height="36" rx="18" fill="#ea580c"/><text x="1368" y="362" font-size="16" font-weight="800" fill="#fff">ON DEMAND</text>
  <text x="1340" y="420" class="section">dev-load-test</text>
  <text x="1340" y="451" class="state">dev-load-test/terraform.tfstate</text>
  <rect x="1340" y="500" width="440" height="102" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="1370" y="540" class="card-title">Load Runner</text><text x="1370" y="572" class="body">k6 EC2 · IAM · Security Group</text>
  <rect x="1340" y="630" width="440" height="102" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1370" y="670" class="card-title">Test Evidence</text><text x="1370" y="702" class="body">Evidence S3 · DB Secret Access</text>
  <text x="1340" y="796" class="small">비교 테스트 때 생성하고 종료 후 destroy</text>

  <path d="M620 575 C650 575 665 575 700 575" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <rect x="602" y="520" width="116" height="32" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="619" y="542" font-size="14" font-weight="700" fill="#475569">remote output</text>
  <path d="M1220 575 C1250 575 1265 575 1300 575" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <rect x="1208" y="520" width="104" height="32" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="1224" y="542" font-size="14" font-weight="700" fill="#475569">test target</text>

  <rect x="100" y="910" width="1720" height="105" rx="24" fill="#0f172a"/>
  <text x="145" y="952" font-size="18" font-weight="800" fill="#93c5fd">CREATE / APPLY</text><text x="315" y="952" font-size="18" font-weight="700" fill="#fff">dev → dev-runtime → dev-load-test</text>
  <text x="1010" y="952" font-size="18" font-weight="800" fill="#fdba74">DESTROY</text><text x="1125" y="952" font-size="18" font-weight="700" fill="#fff">dev-load-test → dev-runtime → dev</text>
  <text x="145" y="990" font-size="16" font-weight="600" fill="#cbd5e1">AWS apply/destroy와 State 변경은 계정·대상 State·plan을 확인한 뒤 별도 승인으로 실행합니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KDT Travel Diary AWS Terraform 환경</title>
  <desc id="desc">유지 중인 dev State와 테스트 후 삭제된 dev-runtime State를 인과 흐름이 아닌 독립된 Root와 State로 비교한 구성도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Inter, sans-serif; }
    .title { font-size: 52px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 23px; font-weight: 500; fill: #475569; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #2563eb; }
    .section { font-size: 30px; font-weight: 800; fill: #0f172a; }
    .card-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .body { font-size: 18px; font-weight: 600; fill: #475569; }
    .small { font-size: 16px; font-weight: 600; fill: #64748b; }
    .active-card { fill: #fff; stroke: #93c5fd; stroke-width: 3; }
    .destroyed-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 10 10; }
  </style>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="120" y="115" class="eyebrow">TERRAFORM · AWS ENVIRONMENT BOUNDARY</text>
  <text x="120" y="185" class="title">지속 환경과 일회성 런타임을 독립 State로 관리합니다</text>
  <text x="120" y="228" class="subtitle">최종 제출 시점 사용자 확인 기준: dev는 유지 중이며, dev-runtime은 테스트 완료 후 리소스를 모두 삭제했습니다.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="310" width="760" height="590" rx="28" class="active-card"/>
    <rect x="1040" y="310" width="760" height="590" rx="28" class="destroyed-card"/>
  </g>
  <rect x="170" y="355" width="116" height="38" rx="19" fill="#16a34a"/><text x="198" y="381" font-size="17" font-weight="800" fill="#fff">ACTIVE</text>
  <text x="315" y="385" class="section">dev State</text>
  <text x="1090" y="385" class="section">dev-runtime State</text>
  <rect x="1450" y="350" width="300" height="42" rx="21" fill="#64748b"/><text x="1478" y="378" font-size="16" font-weight="800" fill="#fff">DESTROYED AFTER TEST</text>

  <g>
    <rect x="170" y="455" width="300" height="130" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="200" y="500" class="card-title">Static Frontend</text><text x="200" y="535" class="body">S3 · CloudFront · ACM</text><text x="200" y="565" class="small">Private bucket + OAC</text>
    <rect x="520" y="455" width="300" height="130" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="550" y="500" class="card-title">Delivery &amp; Images</text><text x="550" y="535" class="body">ECR · OIDC Roles</text><text x="550" y="565" class="small">Profile image S3/CloudFront</text>
    <rect x="170" y="625" width="300" height="130" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="670" class="card-title">Network</text><text x="200" y="705" class="body">2AZ VPC · subnet</text><text x="200" y="735" class="small">공통 기반 State</text>
    <rect x="520" y="625" width="300" height="130" rx="18" fill="#fefce8" stroke="#fde68a" stroke-width="2"/>
    <text x="550" y="670" class="card-title">Secrets Manager</text><text x="550" y="705" class="body">애플리케이션 secret ARN</text><text x="550" y="735" class="small">값은 저장소에 기록하지 않음</text>
  </g>
  <g>
    <rect x="1090" y="455" width="300" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1120" y="500" class="card-title">Backend Runtime</text><text x="1120" y="535" class="body">ALB · EC2 ASG 2/2/4</text><text x="1120" y="565" class="small">재생성 대상 · 현재 없음</text>
    <rect x="1440" y="455" width="300" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1470" y="500" class="card-title">Data Layer</text><text x="1470" y="535" class="body">RDS PostgreSQL · Redis</text><text x="1470" y="565" class="small">실험 완료 후 함께 제거</text>
    <rect x="1090" y="625" width="300" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1120" y="670" class="card-title">Network Cost</text><text x="1120" y="705" class="body">NAT Gateway · private route</text><text x="1120" y="735" class="small">재생성 대상 · 현재 없음</text>
    <rect x="1440" y="625" width="300" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1470" y="670" class="card-title">Observability</text><text x="1470" y="705" class="body">Monitoring EC2 · Alloy</text><text x="1470" y="735" class="small">재생성 대상 · 현재 없음</text>
  </g>

  <line x1="960" y1="310" x2="960" y2="900" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="12 12"/>
  <rect x="855" y="590" width="210" height="44" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="888" y="618" font-size="16" font-weight="800" fill="#475569">독립 Root / State</text>
  <rect x="120" y="950" width="1680" height="60" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="160" y="988" font-size="18" font-weight="800" fill="#c2410c">SAFETY</text><text x="280" y="988" class="body">AWS SSO·원격 State plan은 계정과 변경 범위를 확인한 뒤 실행합니다. apply/destroy는 별도 승인 경계입니다.</text>
</svg>

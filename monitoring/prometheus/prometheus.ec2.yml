global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  # ── Backend는 고정 주소가 아니라 EC2 API로 동적으로 찾음 ──────────
  # ASG가 인스턴스를 만들거나 없애도, 매 scrape마다 다시 조회해서
  # 자동으로 대상 목록을 갱신함 (수동으로 IP를 등록/삭제할 필요 없음)
  - job_name: backend
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9091
        filters:
          - name: instance-state-name
            values: [running]
    relabel_configs:
      # Service=travel-planner-backend 태그 붙은 EC2만 대상으로 삼음
      - source_labels: [__meta_ec2_tag_Service]
        regex: travel-planner-backend
        action: keep
      # Environment 태그로 dev/prod 구분 (dev-runtime엔 dev만 존재)
      - source_labels: [__meta_ec2_tag_Environment]
        regex: dev
        action: keep
      # EC2 Private IP를 실제 scrape target으로 사용
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: "${1}:9091"
      # 카디널리티를 낮게 유지하기 위한 최소 라벨만 남김
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_tag_Version]
        target_label: version

  # ── 나머지는 Monitoring EC2 "안"에서 컨테이너로 같이 도니 고정 주소 그대로 ──
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

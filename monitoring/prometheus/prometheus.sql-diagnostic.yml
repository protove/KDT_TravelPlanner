global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

apiVersion: 1
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: CloudWatch
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
  # ── EC2 환경에서 새로 추가된 것: AWS 관리형 지표(ALB, ASG, RDS 등) ──
  # 인증은 별도 키를 안 넣고, Monitoring EC2에 붙은 IAM Role 권한을 그대로 사용
  # (main.tf의 GrafanaCloudWatchDataSource 정책이 이 권한을 부여함)
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    editable: false
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
